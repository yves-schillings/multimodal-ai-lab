apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared deployment preparation; the openshift-local overlay was accepted on CRC/OKD.
namespace: multimodal-ai-lab
labels:
  - pairs:
      app.kubernetes.io/part-of: multimodal-ai-lab
    includeSelectors: false
    includeTemplates: true
resources:
  - configmap.yaml
  - postgres.yaml
  - mlflow.yaml
  - app.yaml
  - networkpolicy.yaml

# MLflow tracking server (M08) with a PostgreSQL backend store and a PVC for artifacts.
# Prepared, not tested on a cluster. Image: build deploy/docker/mlflow.Dockerfile and push it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-mlflow
spec:
  selector:
    app.kubernetes.io/name: lab-mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-mlflow
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mlflow
          # Replace with the pushed image, for example image-registry.openshift-image-registry.svc:5000/multimodal-ai-lab/lab-mlflow:3.16.1
          image: lab-mlflow:3.16.1
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-postgres
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - >
              exec mlflow server
              --backend-store-uri "postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@lab-postgres:5432/mlflow"
              --artifacts-destination /mlflow/artifacts --serve-artifacts
              --allowed-hosts "lab-mlflow:5000,localhost:5000,127.0.0.1:5000"
              --host 0.0.0.0 --port 5000
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow/artifacts
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 30
          resources:
            requests: {cpu: "100m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts

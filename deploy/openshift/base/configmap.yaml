apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-config
data:
  # Same values as deploy/docker/compose.yaml. Identity stays simulated: no Route in the base.
  LAB_BIND_HOST: "0.0.0.0"
  LAB_PORT: "8770"
  LAB_NETWORK_MODE: "container"
  # Host names accepted in addition to loopback. Leave empty until a trusted identity front end exists.
  LAB_ALLOWED_HOSTS: ""
  LAB_DATA_DIR: "/app/data"
  LAB_WHISPER_MODEL_DIR: "/app/models/whisper-base"
  MLFLOW_TRACKING_URI: "http://lab-mlflow:5000"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

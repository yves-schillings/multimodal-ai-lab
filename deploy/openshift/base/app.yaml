# Application: C01 Browser workspace, C02 Case API, C03 Job runner and the in-process adapters.
# Prepared, not tested on a cluster. One replica: SQLite case store and a single durable worker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-app
spec:
  selector:
    app.kubernetes.io/name: lab-app
  ports:
    - name: http
      port: 8770
      targetPort: 8770
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-app
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Prepared speech weights are copied once into the models PVC by the platform team
        # (scripts/prepare_speech.py output). This init container only reports whether they exist.
        - name: check-speech-weights
          image: lab-app:latest
          command: ["sh", "-c", "test -f /app/models/whisper-base/model.bin && echo 'speech weights present' || echo 'speech weights absent: speech_recognition will be false'"]
          volumeMounts:
            - name: models
              mountPath: /app/models
      containers:
        - name: app
          # Replace with the pushed image, for example image-registry.openshift-image-registry.svc:5000/multimodal-ai-lab/lab-app:latest
          image: lab-app:latest
          envFrom:
            - configMapRef:
                name: lab-config
          ports:
            - containerPort: 8770
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
              readOnly: true
          readinessProbe:
            httpGet: {path: /health/ready, port: 8770}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8770}
            periodSeconds: 30
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "3Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-data
        - name: models
          persistentVolumeClaim:
            claimName: lab-models

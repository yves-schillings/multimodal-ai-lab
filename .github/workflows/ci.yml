name: Tests and container security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pytest tests -q --junitxml=test-results.xml
      - run: node tests/browser_core.test.mjs
      - run: python -m pip_audit -r requirements.txt -f json -o dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-dependency-evidence
          path: |
            test-results.xml
            dependency-audit.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t multimodal-ai-lab:ci .
      - name: Verify arbitrary UID and OCR without network
        run: >-
          docker run --rm --network none --user 1000780000:0
          --cap-drop ALL --security-opt no-new-privileges
          -e LAB_DATA_DIR=/app/data
          -v "${{ github.workspace }}/scripts/container_acceptance.py:/acceptance/container_acceptance.py:ro"
          --entrypoint python multimodal-ai-lab:ci /acceptance/container_acceptance.py
      # Full report (all findings, fixed or not) kept as evidence.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimodal-ai-lab:ci
          format: json
          output: container-audit.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      # Gate: fail only on HIGH/CRITICAL findings that have a fixed version available.
      # Findings without a vendor fix are reported above and reviewed, not silently accepted.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimodal-ai-lab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-evidence
          path: container-audit.json
  mlflow-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f deploy/docker/mlflow.Dockerfile -t multimodal-ai-lab-mlflow:ci deploy/docker
      - name: Verify the MLflow server version, its PostgreSQL driver and its health endpoint
        run: |
          docker run --rm --entrypoint python multimodal-ai-lab-mlflow:ci -c "import mlflow, psycopg2; assert mlflow.__version__ == '3.17.2', mlflow.__version__; print('mlflow', mlflow.__version__)"
          docker run -d --name mlflow-ci -p 5000:5000 multimodal-ai-lab-mlflow:ci mlflow server --backend-store-uri sqlite:////tmp/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts --allowed-hosts "localhost:5000,127.0.0.1:5000" --host 0.0.0.0 --port 5000
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:5000/health
          docker rm -f mlflow-ci
      # Full report (all findings, fixed or not) kept as evidence.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimodal-ai-lab-mlflow:ci
          format: json
          output: mlflow-server-audit.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      # Gate: fail only on HIGH/CRITICAL findings that have a fixed version available.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimodal-ai-lab-mlflow:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-server-security-evidence
          path: mlflow-server-audit.json
